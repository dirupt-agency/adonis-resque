version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Raise the range floor to the new version on every update. The default
    # ("auto") widens ranges for published libraries, which would leave the
    # tested floors behind and produce no PR at all for in-range updates.
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The node-resque range is the range the worker guards are proven against,
      # held equal to GUARDED_RANGE by a test. It moves by hand, with a new alias
      # in the test matrix (see README, "node-resque releases").
      - dependency-name: "node-resque"
      # Each alias pins one node-resque release of the test matrix on purpose.
      - dependency-name: "node-resque-*"
      # TypeScript 7.0 ships no compiler API: typescript-eslint (peer <6.1.0)
      # and @adonisjs/assembler (peer ^5 || ^6) cannot load it. Revisit with 7.1.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
